<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <!-- 휴대폰 세로 전용. 입력창이 16px이라 iOS에서 확대가 일어나지 않으므로 확대 자체는 막지 않습니다(접근성). -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#ffffff" />
    <!--
      ★ 기기가 다크모드여도 화면이 그대로 보여야 합니다.
        color-scheme 을 밝힘으로 못 박아 두지 않으면
          - 안드로이드 크롬의 '자동 어둡게'가 색을 뒤집고
          - 입력창·체크박스가 기기 어두운 색으로 바뀝니다.
        빨간 화면이 검은 것은 우리가 색을 직접 칠한 것이지 다크모드가 아닙니다.
    -->
    <meta name="color-scheme" content="light" />
    <meta name="robots" content="noindex, nofollow" />
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <title>2026 산학연협력 EXPO 안전체험관 경품 응모</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
